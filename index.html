<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Ryukyu — viaje a Japón</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ryukyu">
<meta name="theme-color" content="#F6F1E6">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.open-meteo.com; base-uri 'self'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="iconos/icono-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SISTEMA DE DISEÑO — papel y tinta
   Fondo de papel washi, tinta oscura, rojo hinomaru como único
   acento de marca. El color sigue teniendo dos canales que no
   se pisan:
     · la franja izquierda dice QUÉ es (categoría)
     · el punto del raíl y la etiqueta dicen CÓMO está (estado)
   ============================================================ */
:root{
  --papel:#F6F1E6;          /* fondo, papel cálido */
  --carta:#FFFFFF;          /* tarjetas */
  --tinta:#23262D;          /* texto principal */
  --tenue:#7A7466;          /* texto secundario */
  --linea:#E5DCC8;          /* bordes */
  --rojo:#C7362F;           /* hinomaru: marca, "ahora", activo */
  --jade:#1E7F5C;           /* estado: reservado */
  --ambar:#A9741A;          /* estado: por reservar */
  --c-vuelo:#2F6DB0;
  --c-traslado:#7A4FB0;
  --c-comida:#C2517A;
  --c-mar:#0E8FA8;
  --c-visita:#A4762A;
  --display:'Shippori Mincho B1',Georgia,serif;
  --cuerpo:'Zen Kaku Gothic New',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  --mono:'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px;
  --sombra:0 1px 3px rgba(35,38,45,.07);
  --barra:calc(58px + env(safe-area-inset-bottom));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--papel);
  color:var(--tinta);
  font-family:var(--cuerpo);
  font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  padding-bottom:var(--barra);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--rojo);outline-offset:2px;border-radius:6px}

/* ---------- CABECERA ---------- */
.cab{
  position:sticky;top:0;z-index:40;
  background:rgba(246,241,230,.94);
  backdrop-filter:saturate(160%) blur(14px);
  -webkit-backdrop-filter:saturate(160%) blur(14px);
  border-bottom:1px solid var(--linea);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
}
.cab-fila{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.cab-tit{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.15}
.cab-tit::before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--rojo);margin-right:8px;vertical-align:1px}
.cab-sub{font-family:var(--mono);font-size:11.5px;color:var(--tenue);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.relojes{font-family:var(--mono);font-size:11px;color:var(--tenue);text-align:right;line-height:1.5;white-space:nowrap}
.relojes b{color:var(--tinta);font-weight:500}

/* ---------- ESTRUCTURA ---------- */
.vista{display:none;padding:16px 16px 28px;max-width:640px;margin:0 auto}
.vista.on{display:block;animation:ent .22s ease}
@keyframes ent{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.seccion{margin:30px 0 12px;display:block}
.seccion h2{font-family:var(--display);font-size:20px;font-weight:800;color:var(--tinta);margin:0;line-height:1.15}
.seccion .regla{display:block;height:3px;width:38px;background:var(--rojo);border-radius:2px;margin-top:7px}
.seccion .cuenta-sec{float:right;font-family:var(--mono);font-size:11px;color:var(--tenue);margin-top:6px}

.tarjeta{background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);padding:14px;box-shadow:var(--sombra)}
.tenue{color:var(--tenue)}
.mono{font-family:var(--mono)}
.mini{font-size:12.5px}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- AVISOS ---------- */
.aviso{
  display:flex;gap:10px;align-items:flex-start;
  border-radius:var(--r);padding:11px 13px;margin-bottom:10px;
  font-size:14px;line-height:1.45;border:1px solid;text-align:left;width:100%;
}
.aviso .ic{font-size:15px;line-height:1.35;flex:0 0 auto}
.aviso.alerta{background:#FBEAE8;border-color:#EBC4C0;color:#8C2B25}
.aviso.atencion{background:#FAF3E3;border-color:#EADFC2;color:#7A5A14}
.aviso.info{background:var(--carta);border-color:var(--linea);color:var(--tenue)}
.aviso b{color:inherit}
.aviso .abrir-avisos{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:700;flex:0 0 auto}

/* ---------- LO SIGUIENTE ---------- */
.siguiente{
  position:relative;overflow:hidden;background:var(--carta);
  border:1px solid var(--linea);border-radius:18px;padding:16px 16px 16px 19px;
  box-shadow:var(--sombra);
}
.siguiente::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--rojo)}
.siguiente .eti{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--rojo);font-weight:700}
.siguiente .qué{font-family:var(--display);font-weight:800;font-size:23px;line-height:1.2;margin:6px 0 2px}
.cuenta{font-family:var(--mono);font-size:13px;color:var(--ambar);font-weight:500}

/* ---------- CAJAS DE ARRIBA ---------- */
.cajas{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
.caja{
  background:var(--carta);border:1px solid var(--linea);border-radius:14px;
  padding:12px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;
  text-align:left;width:100%;box-shadow:var(--sombra);
}
.caja .eti{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tenue)}
.caja .gordo{font-family:var(--display);font-size:26px;font-weight:800;line-height:1.05;margin-top:5px}
.caja .peq{font-size:12px;line-height:1.35;color:var(--tenue);margin-top:3px}
.caja.tiempo{background:linear-gradient(165deg,#EEF4F8,#FFFFFF)}
.caja.cama{background:linear-gradient(165deg,#F5F0FA,#FFFFFF)}
.caja .nom{font-size:14.5px;font-weight:700;line-height:1.25;margin-top:5px}
.caja .viejo{color:var(--ambar)}
.caja:active{transform:scale(.985)}

/* ---------- RAÍL DEL DÍA ---------- */
.linea{position:relative;padding-left:62px}
.linea::before{content:"";position:absolute;left:52px;top:6px;bottom:14px;width:1px;background:var(--linea)}
.bloque{position:relative;margin-bottom:14px}
.bloque .hora{
  position:absolute;left:-62px;top:14px;width:44px;text-align:right;
  font-family:var(--mono);font-size:13px;font-weight:500;color:var(--tinta);
}
.bloque::before{
  content:"";position:absolute;left:-14px;top:20px;width:9px;height:9px;border-radius:50%;
  background:var(--papel);border:2px solid var(--tenue);z-index:1;
}
.bloque[data-estado="confirmado"]::before{border-color:var(--jade);background:var(--jade)}
.bloque[data-estado="pendiente"]::before{border-color:var(--ambar);background:var(--papel)}
.bloque[data-estado="sinDecidir"]::before{border-color:var(--rojo);background:var(--papel)}
.bloque.pasado{opacity:.45}
.marca-ahora{position:relative;height:0;margin:0 0 14px}
.marca-ahora::before{content:"";position:absolute;left:-14px;right:0;top:0;height:1px;background:var(--rojo);opacity:.55}
.marca-ahora span{
  position:absolute;left:-62px;top:-8px;
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;
  color:var(--rojo);text-transform:uppercase;background:var(--papel);padding-right:6px;
}

.cuerpo-bloque{
  background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);
  padding:0;overflow:hidden;border-left:3px solid var(--linea);box-shadow:var(--sombra);
}
.bloque[data-cat="vuelo"]    .cuerpo-bloque{border-left-color:var(--c-vuelo)}
.bloque[data-cat="traslado"] .cuerpo-bloque{border-left-color:var(--c-traslado)}
.bloque[data-cat="comida"]   .cuerpo-bloque{border-left-color:var(--c-comida)}
.bloque[data-cat="mar"]      .cuerpo-bloque{border-left-color:var(--c-mar)}
.bloque[data-cat="visita"]   .cuerpo-bloque{border-left-color:var(--c-visita)}

.cabecilla{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:13px 13px 13px 12px}
.cabecilla .ic-cat{font-size:17px;line-height:1;flex:0 0 auto;width:22px;text-align:center}
.cabecilla .med{flex:1;min-width:0}
.cabecilla .tit{font-size:16px;font-weight:700;line-height:1.28;display:block}
.cabecilla .bajo{display:flex;align-items:center;gap:7px;margin-top:5px;flex-wrap:wrap}
.cat-nom{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--tenue)}
.bloque[data-cat="vuelo"]    .cat-nom{color:var(--c-vuelo)}
.bloque[data-cat="traslado"] .cat-nom{color:var(--c-traslado)}
.bloque[data-cat="comida"]   .cat-nom{color:var(--c-comida)}
.bloque[data-cat="mar"]      .cat-nom{color:var(--c-mar)}
.bloque[data-cat="visita"]   .cat-nom{color:var(--c-visita)}
.flecha{flex:0 0 auto;color:var(--tenue);font-size:13px;transition:transform .18s}
.bloque.abierto .flecha{transform:rotate(90deg)}
.detalle{padding:12px 13px 13px;border-top:1px solid var(--linea)}
.pista{font-family:var(--mono);font-size:10.5px;color:var(--tenue);letter-spacing:.03em}

.etiquetas{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.eti-p{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:5px;border:1px solid}
.eti-p.jade{color:var(--jade);border-color:#BFDCCF;background:#EAF5F0}
.eti-p.ambar{color:var(--ambar);border-color:#E6D3AC;background:#F9F2E1}
.eti-p.coral{color:var(--rojo);border-color:#EBC4C0;background:#FBEAE8}
.eti-p.gris{color:var(--tenue);border-color:var(--linea);background:var(--papel)}

/* ---------- OPCIONES ---------- */
.opciones{margin-top:11px;display:flex;flex-direction:column;gap:8px}
.opcion{
  display:block;width:100%;text-align:left;
  background:var(--papel);border:1px solid var(--linea);border-radius:11px;padding:11px 12px;
  transition:border-color .15s,background .15s;
}
.opcion[aria-pressed="true"]{border-color:var(--jade);background:#EAF5F0}
.opcion .on-marca{color:var(--jade);font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em}
.opcion h4{margin:0;font-size:15px;font-weight:700;line-height:1.3}
.opcion p{margin:4px 0 0;font-size:13.5px;color:var(--tenue);line-height:1.45}
.opcion .datos{font-family:var(--mono);font-size:11.5px;color:var(--tenue);margin-top:7px;letter-spacing:.02em}

/* ---------- BOTONES ---------- */
.acciones{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.bt{
  display:inline-flex;align-items:center;gap:6px;
  min-height:40px;padding:0 13px;border-radius:10px;
  border:1px solid var(--linea);background:var(--carta);
  font-size:13.5px;font-weight:700;box-shadow:var(--sombra);
}
.bt:active{transform:scale(.97)}
.bt.primario{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.bt.fino{min-height:34px;font-size:12.5px;font-weight:500;background:none;box-shadow:none}
.bt[disabled]{opacity:.4}

/* ---------- VUELO ---------- */
.vuelo{display:flex;align-items:center;gap:12px;margin-top:4px}
.vuelo .pt{text-align:center;flex:0 0 auto}
.vuelo .pt .cod{font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:.06em}
.vuelo .pt .hr{font-family:var(--mono);font-size:13px;color:var(--ambar);margin-top:1px}
.vuelo .pt .lug{font-size:10.5px;color:var(--tenue);margin-top:2px}
.vuelo .via{flex:1;position:relative;height:1px;background:var(--linea)}
.vuelo .via span{
  position:absolute;left:50%;top:-9px;transform:translateX(-50%);
  background:var(--carta);padding:0 7px;font-family:var(--mono);font-size:10px;color:var(--tenue);
}

/* ---------- VIAJE / TRAMOS ---------- */
.tramo-tit{border-left:4px solid var(--rojo);padding-left:11px;margin:26px 0 10px;display:block}
.tramo-tit h3{font-family:var(--display);font-size:21px;font-weight:800;margin:0;line-height:1.1}
.tramo-tit .fechas{font-family:var(--mono);font-size:11px;color:var(--tenue);letter-spacing:.05em}
.t-transito{border-left-color:var(--tenue)}
.t-kume{border-left-color:var(--c-mar)}
.t-ishigaki{border-left-color:var(--jade)}
.t-koyasan{border-left-color:var(--c-traslado)}
.t-kioto{border-left-color:var(--c-comida)}
.t-kiso{border-left-color:var(--ambar)}
.t-tokio{border-left-color:var(--c-vuelo)}
.t-vuelta{border-left-color:var(--tenue)}

.fila-dia{
  display:flex;gap:12px;align-items:center;width:100%;text-align:left;
  background:var(--carta);border:1px solid var(--linea);border-radius:12px;
  padding:11px 13px;margin-bottom:7px;box-shadow:var(--sombra);
}
.fila-dia.gris{background:transparent;border-style:dashed;opacity:.62;box-shadow:none}
.fila-dia.hoy{border-color:var(--rojo);box-shadow:0 0 0 1px rgba(199,54,47,.3)}
.fila-dia .num{font-family:var(--display);font-size:23px;font-weight:800;line-height:1;width:34px;flex:0 0 auto;text-align:center;color:var(--tenue)}
.fila-dia.hoy .num{color:var(--rojo)}
.fila-dia .txt{flex:1;min-width:0}
.fila-dia .txt b{display:block;font-size:15px;font-weight:700;line-height:1.3}
.fila-dia .txt span{font-family:var(--mono);font-size:11px;color:var(--tenue);letter-spacing:.04em}
.iconos-dia{font-size:13px;letter-spacing:2px;flex:0 0 auto;opacity:.85}

/* ---------- COMIDA ---------- */
.filtros{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:8px 13px;border-radius:999px;
  border:1px solid var(--linea);background:var(--carta);
  font-size:13.5px;font-weight:500;white-space:nowrap;box-shadow:var(--sombra);
}
.chip[aria-pressed="true"]{background:var(--tinta);color:#fff;border-color:var(--tinta);font-weight:700}
.sitio{background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);padding:13px;margin-bottom:9px;box-shadow:var(--sombra)}
.sitio h4{margin:0 0 2px;font-size:16px;font-weight:700;line-height:1.25}
.sitio .jp{font-family:var(--mono);font-size:11.5px;color:var(--tenue)}
.sitio p{margin:7px 0 0;font-size:13.5px;line-height:1.5;color:#4C4A43}
.sitio .meta{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--tenue)}
.cerrado{color:var(--rojo);font-weight:700}

/* ---------- CHECKS ---------- */
.check{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  padding:11px 12px;border-radius:11px;border:1px solid var(--linea);
  background:var(--carta);margin-bottom:6px;box-shadow:var(--sombra);
}
.check .caja{
  flex:0 0 auto;width:21px;height:21px;border-radius:6px;
  border:2px solid var(--tenue);margin-top:1px;background:none;box-shadow:none;min-height:0;padding:0;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;
}
.check[aria-pressed="true"] .caja{background:var(--jade);border-color:var(--jade)}
.check[aria-pressed="true"] .lab{opacity:.5;text-decoration:line-through}
.check .lab{font-size:14.5px;line-height:1.4}
.check .lab em{display:block;font-style:normal;font-size:12.5px;color:var(--tenue);margin-top:2px}

/* ---------- SEGMENTOS ---------- */
.segs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;margin-bottom:6px}
.segs::-webkit-scrollbar{display:none}
.seg{
  flex:0 0 auto;padding:9px 14px;border-radius:11px;border:1px solid var(--linea);
  background:var(--carta);font-size:14px;font-weight:600;white-space:nowrap;box-shadow:var(--sombra);
}
.seg[aria-current="true"]{background:var(--rojo);color:#fff;border-color:var(--rojo);font-weight:700}

/* ---------- JUEGO ---------- */
.juego{border:1px solid var(--linea);border-radius:18px;overflow:hidden;background:var(--carta);box-shadow:var(--sombra)}
.juego-cab{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;border-bottom:1px solid var(--linea);
  background:linear-gradient(90deg,#FBEAE8,transparent);
}
.juego-cab .t{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--rojo)}
.racha{font-family:var(--mono);font-size:12px;color:var(--tinta);font-weight:500}
.juego-cuerpo{padding:14px}
.dato{font-size:14.5px;line-height:1.55;color:#3E3C36}
.dato .fuente{display:block;font-family:var(--mono);font-size:10.5px;color:var(--tenue);margin-top:6px;letter-spacing:.03em}
.quiz-op{
  display:block;width:100%;text-align:left;padding:11px 13px;border-radius:11px;
  border:1px solid var(--linea);background:var(--papel);margin-bottom:7px;font-size:14.5px;
}
.quiz-op.ok{border-color:var(--jade);background:#EAF5F0}
.quiz-op.mal{border-color:var(--rojo);background:#FBEAE8}
.insignias{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px}
.insignia{border:1px solid var(--linea);border-radius:12px;padding:11px 8px;text-align:center;background:var(--carta);box-shadow:var(--sombra)}
.insignia.no{opacity:.35}
.insignia .em{font-size:23px;display:block;line-height:1.2}
.insignia .nm{font-size:11px;font-weight:700;margin-top:4px;line-height:1.25}

/* ---------- BARRA INFERIOR ---------- */
.barra{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(255,255,255,.96);
  backdrop-filter:saturate(160%) blur(16px);
  -webkit-backdrop-filter:saturate(160%) blur(16px);
  border-top:1px solid var(--linea);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:58px;color:var(--tenue)}
.tab .g{font-size:19px;line-height:1}
.tab .n{font-size:10px;font-weight:700;letter-spacing:.02em}
.tab[aria-current="page"]{color:var(--rojo)}
.tab[aria-current="page"]::before{content:"";position:absolute;margin-top:-52px;width:26px;height:2px;background:var(--rojo);border-radius:2px}

/* ---------- ESTADO / OFFLINE ---------- */
.sinred{
  display:none;background:#FAF3E3;border-bottom:1px solid #EADFC2;
  color:#7A5A14;font-size:12.5px;padding:7px 16px;text-align:center;
}
body.offline .sinred{display:block}

/* ---------- MODAL PERFIL ---------- */
.velo{position:fixed;inset:0;z-index:90;background:rgba(246,241,230,.97);display:flex;align-items:center;justify-content:center;padding:22px}
.velo[hidden]{display:none}
.panel{width:100%;max-width:400px}
.panel h2{font-family:var(--display);font-size:26px;font-weight:800;margin:0 0 6px;line-height:1.2}
.panel h2::before{content:"";display:inline-block;width:13px;height:13px;border-radius:50%;background:var(--rojo);margin-right:9px}
.panel p{color:var(--tenue);font-size:14px;margin:0 0 18px;line-height:1.5}
.gente{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.persona{
  padding:14px 10px;border-radius:12px;border:1px solid var(--linea);background:var(--carta);
  font-size:15.5px;font-weight:700;text-align:center;box-shadow:var(--sombra);
}
.persona small{display:block;font-family:var(--mono);font-size:10px;color:var(--tenue);font-weight:400;margin-top:3px;letter-spacing:.06em}

/* ---------- SELECTOR Y CONVERSOR ---------- */
.selector{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.selector .bt{flex:0 0 auto}
.selector .centro{flex:1;text-align:center;font-family:var(--mono);font-size:12px;color:var(--tenue);letter-spacing:.06em}
.conversor{display:flex;gap:8px;align-items:center;margin-top:9px}
.conversor input{
  flex:1;min-width:0;background:var(--papel);border:1px solid var(--linea);border-radius:10px;
  color:var(--tinta);font-family:var(--mono);font-size:16px;padding:10px 12px;
}
.conversor .res{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--rojo);white-space:nowrap}
</style>
</head>

<script>
/* ═══════════  MOTOR DE LA APP — no hace falta tocar nada aquí  ═══════════ */
(function(){
"use strict";

/* ---------- Almacenamiento con red de seguridad ----------
   Intenta el disco del móvil. Si el navegador lo bloquea (modo privado,
   vista previa incrustada), sigue funcionando en memoria durante la sesión
   en vez de romperse. */
const Mem = {};
const Guardar = {
  leer(k, porDefecto){
    try{ const v = localStorage.getItem("ryukyu:"+k); return v===null ? porDefecto : JSON.parse(v); }
    catch(e){ return (k in Mem) ? Mem[k] : porDefecto; }
  },
  escribir(k, v){
    Mem[k] = v;
    try{ localStorage.setItem("ryukyu:"+k, JSON.stringify(v)); }catch(e){}
  }
};

let estado = {
  perfil: Guardar.leer("perfil", null),
  vista: "hoy",
  diaVisto: null,
  elegidas: Guardar.leer("elegidas", {}),
  checks:   Guardar.leer("checks", {}),
  quiz:     Guardar.leer("quiz", {}),
  retos:    Guardar.leer("retos", {}),
  predi:    Guardar.leer("predi", {}),
  visitas:  Guardar.leer("visitas", []),
  filtro:   {contexto:"todo", antojo:"todo"},
  abiertos: {},
  avisosVer: null,
  seg:      "maleta"
};

/* ---------- Utilidades de fecha ---------- */
const DIAS_SEM = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

function ahora(){ return new Date(); }
/* Hora real en una zona, sin líos de horario de verano */
function partesEn(zona, d){
  const f = new Intl.DateTimeFormat("es-ES",{timeZone:zona,hour12:false,
    year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
  const o = {}; f.formatToParts(d||new Date()).forEach(p=>o[p.type]=p.value);
  return {fecha:`${o.year}-${o.month}-${o.day}`, hora:`${o.hour==="24"?"00":o.hour}:${o.minute}`,
          min:(+o.hour%24)*60 + (+o.minute)};
}
function hhmm(iso){
  const m = iso.match(/T(\d{2}):(\d{2})/); return m ? m[1]+":"+m[2] : "";
}
function fechaLarga(f){
  const [a,m,d] = f.split("-").map(Number);
  const dt = new Date(Date.UTC(a,m-1,d));
  return DIAS_SEM[dt.getUTCDay()] + " " + d + " de " + MESES[m-1];
}
function diaSemana(f){
  const [a,m,d] = f.split("-").map(Number);
  return new Date(Date.UTC(a,m-1,d)).getUTCDay();
}
function minutosDe(hm){ if(!hm) return null; const p=hm.split(":"); return +p[0]*60 + +p[1]; }

function diaDeHoy(){
  const iso = partesEn("Asia/Tokyo").fecha;
  return DIAS.find(d=>d.fecha===iso) || null;
}
function diaActivo(){
  if(estado.diaVisto){ const d = DIAS.find(x=>x.id===estado.diaVisto); if(d) return d; }
  return diaDeHoy() || DIAS[0];
}
function esHoy(d){ const h = diaDeHoy(); return h && h.id===d.id; }

/* ---------- Enlaces a mapas (iOS primero, funciona sin datos) ---------- */
function mapaApple(nom, lat, lng){
  if(lat==null) return "";
  return "https://maps.apple.com/?ll="+lat+","+lng+"&q="+encodeURIComponent(nom)+"&z=16";
}
function mapaGoogle(lat, lng){
  if(lat==null) return "";
  return "https://www.google.com/maps/search/?api=1&query="+lat+","+lng;
}

/* ---------- Dinero ---------- */
function aEuros(y){ return (y*YEN_EUR).toLocaleString("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:2}); }

/* ---------- Horarios: ¿abre este día? ---------- */
function abreEl(sitio, fecha){
  if(!sitio.cierra || !sitio.cierra.length) return true;
  return !sitio.cierra.includes(diaSemana(fecha));
}

/* ---------- Calendario .ics ---------- */
function aUTC(iso){
  const d = new Date(iso);
  const p = n=>String(n).padStart(2,"0");
  return d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+"T"+p(d.getUTCHours())+p(d.getUTCMinutes())+"00Z";
}
function escIcs(s){ return String(s).replace(/[\\;,]/g,m=>"\\"+m).replace(/\n/g,"\\n"); }
function eventoIcs({uid,ini,fin,tit,lugar,desc,aviso}){
  return ["BEGIN:VEVENT","UID:"+uid+"@ryukyu","DTSTAMP:"+aUTC(new Date().toISOString()),
   "DTSTART:"+aUTC(ini),"DTEND:"+aUTC(fin||ini),"SUMMARY:"+escIcs(tit),
   lugar?"LOCATION:"+escIcs(lugar):"", desc?"DESCRIPTION:"+escIcs(desc):"",
   "BEGIN:VALARM","TRIGGER:-PT"+(aviso||60)+"M","ACTION:DISPLAY","DESCRIPTION:"+escIcs(tit),"END:VALARM",
   "END:VEVENT"].filter(Boolean).join("\r\n");
}
function icsDelViaje(){
  const ev = [];
  DIAS.forEach(d=>{
    if(!d.bloques) return;
    if(estado.perfil && !d.grupos.includes(GENTE.find(g=>g.id===estado.perfil).grupo)) return;
    d.bloques.forEach(b=>{
      if(b.vuelo){
        ev.push(eventoIcs({uid:b.id, ini:b.vuelo.salida, fin:b.vuelo.llegada,
          tit:"✈︎ "+b.vuelo.numero+"  "+b.vuelo.desde+" → "+b.vuelo.hasta,
          lugar:b.vuelo.desdeNom,
          desc:"Localizador "+b.vuelo.localizador+"\nLlega a "+b.vuelo.hastaNom+" a las "+hhmm(b.vuelo.llegada)+(b.estado==="pendiente"?"\n\n⚠︎ SIN RESERVAR":""),
          aviso:180}));
      } else if(b.hora){
        const ini = d.fecha+"T"+b.hora+":00"+d.tz;
        ev.push(eventoIcs({uid:b.id, ini, fin:ini, tit:b.titulo, desc:d.titular, aviso:45}));
      }
    });
  });
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Ryukyu//ES","CALSCALE:GREGORIAN",
    "X-WR-CALNAME:Viaje a Japón", ...ev, "END:VCALENDAR"].join("\r\n");
}
function bajarIcs(texto, nombre){
  const b = new Blob([texto],{type:"text/calendar;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = nombre; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 500);
}

/* ---------- Piezas de HTML ---------- */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function pintaAviso(a){
  const ic = a.tono==="alerta" ? "▲" : a.tono==="atencion" ? "◆" : "•";
  return `<div class="aviso ${a.tono}"><span class="ic">${ic}</span><div>${a.texto}</div></div>`;
}
function pintaVuelo(b){
  const v = b.vuelo;
  return `<div class="vuelo">
    <div class="pt"><div class="cod">${esc(v.desde)}</div><div class="hr">${hhmm(v.salida)}</div><div class="lug">${esc(v.desdeNom)}</div></div>
    <div class="via"><span>${esc(v.numero)}</span></div>
    <div class="pt"><div class="cod">${esc(v.hasta)}</div><div class="hr">${hhmm(v.llegada)}</div><div class="lug">${esc(v.hastaNom)}</div></div>
  </div>`;
}
function etiquetaEstado(e){
  if(e==="confirmado") return `<span class="eti-p jade">reservado</span>`;
  if(e==="pendiente")  return `<span class="eti-p ambar">por reservar</span>`;
  if(e==="sinDecidir") return `<span class="eti-p coral">sin decidir</span>`;
  return "";
}
function pintaOpcion(bloqueId, o){
  const elegida = estado.elegidas[bloqueId]===o.id;
  const lug = o.lugar;
  return `<button class="opcion" aria-pressed="${elegida}" data-elige="${bloqueId}|${o.id}">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">
      <h4>${esc(o.nombre)}</h4>${elegida?'<span class="on-marca">ELEGIDA</span>':""}
    </div>
    ${o.desc?`<p>${esc(o.desc)}</p>`:""}
    ${o.datos?`<div class="datos">${esc(o.datos)}</div>`:""}
    ${(o.avisos||[]).map(a=>`<div class="datos" style="color:var(--ambar)">◆ ${esc(a)}</div>`).join("")}
    <div class="acciones">
      ${lug?`<span class="bt fino" data-abre="${esc(mapaApple(lug.nombre,lug.lat,lug.lng))}">Mapa</span>`:""}
      ${o.web?`<span class="bt fino" data-abre="${esc(o.web)}">Web</span>`:""}
    </div>
  </button>`;
}


/* ---------- Categorías: qué es cada cosa ---------- */
const CATS = {
  vuelo:    {nom:"Vuelo",    ic:"✈"},
  traslado: {nom:"Traslado", ic:"🚌"},
  comida:   {nom:"Comida",   ic:"🍜"},
  mar:      {nom:"Mar",      ic:"🤿"},
  visita:   {nom:"Visita",   ic:"⛩"},
  plan:     {nom:"Plan",     ic:"◆"}
};
function catDe(b){
  if(b.cat && CATS[b.cat]) return b.cat;
  if(b.tipo==="transporte") return "vuelo";
  if(b.tipo==="traslado")   return "traslado";
  if(b.tipo==="comida")     return "comida";
  return "plan";
}
/* Qué se ve sin desplegar: una línea corta y nada más */
function resumenDe(b){
  if(b.vuelo) return b.vuelo.desde+" → "+b.vuelo.hasta;
  if(b.opciones && b.opciones.length>1) return b.opciones.length+" opciones";
  if(b.opciones && b.opciones.length===1) return b.opciones[0].nombre;
  return "";
}

/* ---------- Tiempo (Open-Meteo: sin clave y sin backend) ---------- */
const CIELO = {0:["Despejado","☀️"],1:["Casi despejado","🌤"],2:["Nubes y claros","⛅️"],3:["Nublado","☁️"],
 45:["Niebla","🌫"],48:["Niebla","🌫"],51:["Llovizna","🌦"],53:["Llovizna","🌦"],55:["Llovizna","🌦"],
 61:["Lluvia floja","🌧"],63:["Lluvia","🌧"],65:["Lluvia fuerte","🌧"],
 80:["Chubascos","🌦"],81:["Chubascos","🌦"],82:["Chubascos fuertes","⛈"],
 95:["Tormenta","⛈"],96:["Tormenta","⛈"],99:["Tormenta","⛈"]};
/* Si nunca se ha bajado nada, al menos la media de la época */
const CLIMA_TIPICO = {
  "Kume-jima":"24-27° de media a finales de octubre. Agua a unos 26°.",
  "Ishigaki":"25-27° de media a principios de noviembre. Agua a unos 27°.",
  "Kioto":"10-18° en noviembre.", "Tokio":"10-18° en noviembre.",
  "Valle de Kiso":"4-15° en noviembre, frío de montaña.", "Koyasan":"3-13° en noviembre, frío."
};

function tiempoGuardado(d){ return Guardar.leer("tiempo:"+d.fecha, null); }

async function bajaTiempo(d){
  if(!d.coords || !navigator.onLine) return false;
  const [la,lo] = d.coords;
  const u = `https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}`
    + `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max`
    + `&timezone=auto&start_date=${d.fecha}&end_date=${d.fecha}`;
  try{
    const r = await fetch(u);
    const j = await r.json();
    if(!j.daily || !j.daily.time || !j.daily.time.length) return false;
    Guardar.escribir("tiempo:"+d.fecha, {
      max:Math.round(j.daily.temperature_2m_max[0]),
      min:Math.round(j.daily.temperature_2m_min[0]),
      cod:j.daily.weather_code[0],
      lluvia:j.daily.precipitation_probability_max[0],
      cuando:Date.now()
    });
    if(estado.vista==="hoy") pintaHoy();
    return true;
  }catch(e){ return false; }
}
function haceCuanto(ms){
  const m = Math.round((Date.now()-ms)/60000);
  if(m<60) return "hace "+m+" min";
  const h = Math.round(m/60);
  if(h<24) return "hace "+h+" h";
  return "hace "+Math.round(h/24)+" días";
}

/* ---------- Cajas de tiempo y cama ---------- */
function pintaCajas(d){
  const t = tiempoGuardado(d);
  let caja1;
  if(t){
    const [txt,em] = CIELO[t.cod] || ["—","·"];
    caja1 = `<button class="caja tiempo" data-tiempo="1">
      <div class="eti">tiempo</div>
      <div><div class="gordo">${em} ${t.max}°</div>
      <div class="peq">${esc(txt)} · mín ${t.min}°${t.lluvia!=null?` · ${t.lluvia}% lluvia`:""}</div></div>
      <div class="peq ${Date.now()-t.cuando>21600000?"viejo":""}" data-pie-tiempo>Actualizado ${haceCuanto(t.cuando)} · toca para refrescar</div>
    </button>`;
  } else {
    const isla = Object.keys(CLIMA_TIPICO).find(k=>d.isla.includes(k.split("-")[0].split(" ")[0]));
    caja1 = `<button class="caja tiempo" data-tiempo="1">
      <div class="eti">tiempo</div>
      <div><div class="gordo" style="font-size:19px">Sin previsión</div>
      <div class="peq">${esc(isla?CLIMA_TIPICO[isla]:"Toca con los datos encendidos y se guarda para verla luego sin conexión.")}</div></div>
      <div class="peq" data-pie-tiempo>Media de la época · toca para bajarla</div>
    </button>`;
  }

  const al = ALOJ[d.alojamientoId];
  const caja2 = al
    ? `<button class="caja cama" data-abre="${esc(mapaApple(al.nombre,al.lat,al.lng))}">
        <div class="eti">esta noche</div>
        <div><div class="nom">${esc(al.nombre)}</div>
        <div class="peq">${esc(al.dir.split(",")[0])}</div></div>
        <div class="peq" style="color:var(--papel)">Abrir en mapas →</div>
      </button>`
    : `<div class="caja cama">
        <div class="eti">esta noche</div>
        <div><div class="nom" style="color:var(--ambar)">Sin alojamiento</div>
        <div class="peq">Todavía no está puesto dónde dormís este día.</div></div>
      </div>`;
  return `<div class="cajas">${caja1}${caja2}</div>`;
}

/* ---------- VISTA: HOY ---------- */
function pintaHoy(){
  const d = diaActivo();
  const yo = GENTE.find(g=>g.id===estado.perfil);
  const miGrupo = yo ? yo.grupo : "A";
  const fuera = !d.grupos.includes(miGrupo);
  const hoy = esHoy(d);
  const minAhora = hoy ? partesEn("Asia/Tokyo").min : -1;
  const idx = DIAS.indexOf(d);

  let h = `<div class="selector">
    <button class="bt" ${idx===0?"disabled":""} data-dia="${idx>0?DIAS[idx-1].id:""}">‹</button>
    <div class="centro">${hoy?"HOY · ":""}${esc(fechaLarga(d.fecha).toUpperCase())}</div>
    <button class="bt" ${idx===DIAS.length-1?"disabled":""} data-dia="${idx<DIAS.length-1?DIAS[idx+1].id:""}">›</button>
  </div>`;

  h += pintaCajas(d);

  if(fuera) h += pintaAviso({tono:"info", texto:`Este tramo no es tuyo: ${esc(d.isla)} lo hacen Nacho, Laura, Álvaro y Cris. Tú te unes el 3 de noviembre en Osaka.`});
  if(d.porPlanificar) h += pintaAviso({tono:"atencion", texto:"<b>Día por planificar.</b> Todavía no hay nada cargado para esta jornada."});
  const avs = d.avisos||[];
  if(avs.length===1){ h += pintaAviso(avs[0]); }
  else if(avs.length>1){
    const abiertoAv = estado.avisosVer===d.id;
    const peor = avs.some(a=>a.tono==="alerta") ? "alerta" : avs.some(a=>a.tono==="atencion") ? "atencion" : "info";
    h += `<button class="aviso ${peor}" data-avisos="${d.id}">
      <span class="ic">${peor==="alerta"?"▲":"◆"}</span>
      <div><b>${avs.length} avisos de este día</b>${abiertoAv?"":" — toca para leerlos"}</div>
      <span class="abrir-avisos">${abiertoAv?"CERRAR":"VER"}</span></button>`;
    if(abiertoAv) avs.forEach(a=> h += pintaAviso(a));
  }

  /* Lo siguiente */
  if(hoy && d.bloques){
    const sig = d.bloques.filter(b=>b.hora && minutosDe(b.hora)>minAhora)[0];
    if(sig){
      const falta = minutosDe(sig.hora) - minAhora;
      const txt = falta<60 ? `en ${falta} min` : `en ${Math.floor(falta/60)} h ${falta%60} min`;
      h += `<div class="siguiente">
        <div class="eti">lo siguiente</div>
        <div class="qué">${esc(sig.titulo)}</div>
        <div class="cuenta">${esc(sig.hora)} · ${txt}</div>
        ${sig.vuelo?pintaVuelo(sig):""}
      </div>`;
    }
  }

  /* Línea del día */
  if(d.bloques && d.bloques.length){
    h += `<div class="seccion"><h2>El día</h2><div class="regla"></div></div><div class="linea">`;
    let puesta = false;
    const sigId = hoy ? (d.bloques.filter(b=>b.hora && minutosDe(b.hora)>minAhora)[0]||{}).id : null;
    d.bloques.forEach(b=>{
      const m = minutosDe(b.hora);
      if(hoy && !puesta && m!=null && m>minAhora){
        h += `<div class="marca-ahora"><span>ahora</span></div>`; puesta = true;
      }
      const pasado = hoy && m!=null && m<=minAhora;
      const cat = catDe(b);
      /* Abierto si el usuario lo abrió, o si es lo siguiente que toca hoy */
      const abierto = (b.id in estado.abiertos) ? estado.abiertos[b.id] : (b.id===sigId);
      const res = resumenDe(b);

      h += `<div class="bloque ${pasado?"pasado":""} ${abierto?"abierto":""}" data-estado="${b.estado||""}" data-cat="${cat}">
        <div class="hora">${esc(b.hora||"")}</div>
        <div class="cuerpo-bloque">
          <button class="cabecilla" data-plega="${b.id}" aria-expanded="${abierto}">
            <span class="ic-cat">${CATS[cat].ic}</span>
            <span class="med">
              <span class="tit">${esc(b.titulo)}</span>
              <span class="bajo">
                <span class="cat-nom">${CATS[cat].nom}</span>
                ${etiquetaEstado(b.estado)}
                ${res?`<span class="pista">${esc(res)}</span>`:""}
              </span>
            </span>
            <span class="flecha">›</span>
          </button>`;

      if(abierto){
        h += `<div class="detalle">
          ${b.vuelo?pintaVuelo(b):""}
          ${b.vuelo?`<div class="acciones">
             <span class="bt fino">Localizador ${esc(b.vuelo.localizador)}</span>
             <button class="bt fino" data-ics="${b.id}">Añadir al calendario</button></div>`:""}
          ${(b.avisos||[]).map(a=>`<div class="aviso atencion" style="margin:9px 0 0;font-size:13px"><span class="ic">◆</span><div>${esc(a)}</div></div>`).join("")}
          ${b.opciones?`<div class="opciones">${b.opciones.map(o=>pintaOpcion(b.id,o)).join("")}</div>`:""}
          ${(!b.vuelo && !b.opciones && !(b.avisos||[]).length)?`<div class="mini tenue">Sin detalles todavía.</div>`:""}
        </div>`;
      }
      h += `</div></div>`;
    });
    if(hoy && !puesta) h += `<div class="marca-ahora"><span>ahora</span></div>`;
    h += `</div>`;
  }

  /* Comida del día */
  if(d.comida){
    h += `<div class="seccion"><h2>Comer hoy</h2><div class="regla"></div></div>`;
    Object.keys(d.comida).forEach(momento=>{
      const c = d.comida[momento];
      h += `<div class="tarjeta" style="margin-bottom:9px">
        <div class="mono mini tenue" style="letter-spacing:.14em;text-transform:uppercase">${esc(momento)}</div>
        ${c.nota?`<div class="mini tenue" style="margin-top:4px">${esc(c.nota)}</div>`:""}`;
      (c.sugerencias||[]).forEach(id=>{
        const s = SITIOS.find(x=>x.id===id); if(!s) return;
        const abre = abreEl(s, d.fecha);
        h += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--linea)">

/* ---------- Cápsula de juego ---------- */
function pintaJuego(d){
  const j = d.juego, r = estado.quiz[j.quiz?.id];
  const hechoReto = estado.retos[j.reto?.id];
  let h = `<div class="seccion"><h2>Hoy toca</h2><div class="regla"></div></div><div class="juego">
    <div class="juego-cab"><span class="t">reto del día</span><span class="racha">racha ${racha()} 🔥</span></div>
    <div class="juego-cuerpo">
      <div style="font-size:15.5px;line-height:1.5">${esc(j.reto.texto)}</div>
      <div class="acciones"><button class="bt ${hechoReto?"":"primario"}" data-reto="${j.reto.id}">${hechoReto?"✓ Hecho":"Marcar como hecho"}</button></div>
    </div>`;
  if(j.dato){
    h += `<div class="juego-cab" style="border-top:1px solid var(--linea)"><span class="t">dato del día</span></div>
    <div class="juego-cuerpo"><div class="dato">${esc(j.dato.texto)}<span class="fuente">Fuente: ${esc(j.dato.fuente)}</span></div></div>`;
  }
  if(j.quiz){
    h += `<div class="juego-cab" style="border-top:1px solid var(--linea)"><span class="t">quiz</span></div><div class="juego-cuerpo">
      <div style="font-weight:700;font-size:15.5px;margin-bottom:10px">${esc(j.quiz.pregunta)}</div>`;
    j.quiz.opciones.forEach((o,i)=>{
      let cl = "";
      if(r!==undefined) cl = (i===j.quiz.correcta) ? "ok" : (i===r ? "mal" : "");
      h += `<button class="quiz-op ${cl}" ${r!==undefined?"disabled":""} data-quiz="${j.quiz.id}|${i}|${j.quiz.correcta}">${esc(o)}</button>`;
    });
    if(r!==undefined) h += `<div class="mini tenue" style="margin-top:8px;line-height:1.5">${esc(j.quiz.explicacion)}</div>`;
    h += `</div>`;
  }
  if(j.prediccion){
    const p = estado.predi[j.prediccion.id];
    h += `<div class="juego-cab" style="border-top:1px solid var(--linea)"><span class="t">tu apuesta</span></div><div class="juego-cuerpo">
      <div style="font-weight:700;font-size:15px;margin-bottom:10px">${esc(j.prediccion.texto)}</div>`;
    j.prediccion.opciones.forEach((o,i)=>{
      h += `<button class="quiz-op ${p===i?"ok":""}" data-predi="${j.prediccion.id}|${i}">${esc(o)}</button>`;
    });
    h += `</div>`;
  }
  return h + `</div>`;
}
function racha(){
  const v = estado.visitas.slice().sort();
  if(!v.length) return 0;
  let n = 1;
  for(let i=v.length-1;i>0;i--){
    const a = new Date(v[i]), b = new Date(v[i-1]);
    if((a-b)/86400000 <= 1.5) n++; else break;
  }
  return n;
}

function ganada(id, s){
  if(id==="i-quiz3")  return s.aciertos>=3;
  if(id==="i-racha5") return racha()>=5;
  if(id==="i-retos")  return s.retosHechos>=5;
  if(id==="i-buceo")  return !!estado.retos["d2-r"];
  if(id==="i-arena")  return !!estado.retos["d3-r"];
  if(id==="i-manta")  return !!estado.retos["d4-r"];
  if(id==="i-maleta") return PREP.maleta.every(i=>estado.checks[i.id]);
  if(id==="i-todos")  return !!estado.retos["d6-r"];
  return false;
}

function pintaBarra(){

function ir(v){
  estado.vista = v;
  document.querySelectorAll(".vista").forEach(s=>s.classList.remove("on"));
  document.getElementById("v-"+v).classList.add("on");
  window.scrollTo(0,0);
  pintaBarra();
  render();
}
function render(){
  try{
    pintaCab();
    if(estado.vista==="hoy"){ pintaHoy(); bajaTiempo(diaActivo()); }
    if(estado.vista==="viaje") pintaViaje();
    if(estado.vista==="comida") pintaComida();
    if(estado.vista==="prep") pintaPrep();
    if(estado.vista==="juego") pintaJuegoVista();
  }catch(err){
    const v = document.getElementById("v-"+estado.vista);
    if(v) v.innerHTML = `<div class="aviso alerta"><span class="ic">▲</span><div><b>Algo ha fallado pintando esta pantalla.</b> Suele ser un error de formato en los datos: revisa el último cambio. Detalle: ${esc(err.message)}</div></div>`;

}

/* ---------- Un solo oyente para todo ---------- */
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-tab],[data-dia],[data-elige],[data-check],[data-quiz],[data-reto],[data-predi],[data-fc],[data-fa],[data-plega],[data-seg],[data-tiempo],[data-avisos],[data-abre],[data-ics],[data-ics-todo],[data-sync],[data-perfil],[data-yo]");
  if(!t) return;
  const d = t.dataset;

  if(d.abre){
    e.preventDefault(); e.stopPropagation();
    if(/^https:\/\//i.test(d.abre)) window.open(d.abre, "_blank", "noopener,noreferrer");
    return;
  }
  if(d.tab){ ir(d.tab); return; }
  if(d.yo){ estado.perfil = d.yo; Guardar.escribir("perfil", d.yo); document.getElementById("velo").hidden = true; render(); return; }
  if(d.perfil){ pidePerfil(); return; }
  if(d.dia){ estado.diaVisto = d.dia; estado.abiertos = {}; ir("hoy"); bajaTiempo(diaActivo()); return; }
  if(d.elige){
    const [b,o] = d.elige.split("|");
    estado.elegidas[b] = (estado.elegidas[b]===o) ? null : o;
    Guardar.escribir("elegidas", estado.elegidas); render(); return;
  }
  if(d.check){ estado.checks[d.check] = !estado.checks[d.check]; Guardar.escribir("checks", estado.checks); render(); return; }
  if(d.reto){ estado.retos[d.reto] = !estado.retos[d.reto]; Guardar.escribir("retos", estado.retos); render(); return; }
  if(d.quiz){ const [id,i] = d.quiz.split("|"); estado.quiz[id] = +i; Guardar.escribir("quiz", estado.quiz); render(); return; }
  if(d.predi){ const [id,i] = d.predi.split("|"); estado.predi[id] = +i; Guardar.escribir("predi", estado.predi); render(); return; }
  if(d.avisos){
    estado.avisosVer = (estado.avisosVer===d.avisos) ? null : d.avisos;
    pintaHoy(); return;
  }
  if(d.tiempo){
    const pie = t.querySelector("[data-pie-tiempo]");
    if(!navigator.onLine){
      if(pie){ pie.textContent = "Sin conexión ahora mismo"; setTimeout(()=>pintaHoy(), 1800); }
      return;
    }
    if(pie) pie.textContent = "Actualizando…";
    bajaTiempo(diaActivo()).then(ok=>{
      if(!ok && pie){ pie.textContent = "No se pudo bajar. Prueba otra vez."; setTimeout(()=>pintaHoy(), 2200); }
    });
    return;
  }
  if(d.plega){
    const sig = document.querySelector(`[data-plega="${d.plega}"]`);
    estado.abiertos[d.plega] = !(sig && sig.getAttribute("aria-expanded")==="true");
    pintaHoy(); return;
  }
  if(d.seg){ estado.seg = d.seg; pintaPrep(); window.scrollTo(0,0); return; }
  if(d.fc){ estado.filtro.contexto = d.fc; pintaComida(); return; }
  if(d.fa){ estado.filtro.antojo = d.fa; pintaComida(); return; }
  if(d.icsTodo){ bajarIcs(icsDelViaje(), "viaje-japon.ics"); return; }
  if(d.ics){
    const dia = DIAS.find(x=>(x.bloques||[]).some(b=>b.id===d.ics));
    if(!dia) return;
    const b = dia.bloques.find(x=>x.id===d.ics);
    if(!b || !b.vuelo) return;
    bajarIcs(["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Ryukyu//ES",
      eventoIcs({uid:b.id, ini:b.vuelo.salida, fin:b.vuelo.llegada,
        tit:"✈︎ "+b.vuelo.numero+"  "+b.vuelo.desde+" → "+b.vuelo.hasta,
        lugar:b.vuelo.desdeNom, desc:"Localizador "+b.vuelo.localizador, aviso:180}),
      "END:VCALENDAR"].join("\r\n"), b.vuelo.numero+".ics");
    return;
  }
  if(d.sync){ sincroniza(t); return; }
});

document.addEventListener("input", e=>{
  if(e.target.id==="yen"){
    document.getElementById("eur").textContent = aEuros(+e.target.value||0);
  }
});

/* ---------- Sincronización manual ---------- */
async function sincroniza(bt){
  if(!SYNC_URL || !/^https:\/\//i.test(SYNC_URL)) return;
  bt.textContent = "Bajando…"; bt.disabled = true;
  try{
    const r = await fetch(SYNC_URL, {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json();
    const bienFormado = j && typeof j.VERSION==="number" && Array.isArray(j.DIAS);
    if(!bienFormado){ bt.textContent = "El archivo remoto no tiene buena pinta"; }
    else if(j.VERSION > VERSION){ Guardar.escribir("remoto", j); bt.textContent = "Versión "+j.VERSION+" — reinicia la app"; }
    else bt.textContent = "Ya tienes la última";
  }catch(err){ bt.textContent = "Sin conexión"; }
  setTimeout(()=>{ bt.textContent = "Buscar una versión más nueva"; bt.disabled = false; }, 2800);
}

/* ---------- Estado de red ---------- */
function marcaRed(){ document.body.classList.toggle("offline", !navigator.onLine); }
window.addEventListener("online", marcaRed);
window.addEventListener("offline", marcaRed);

/* ---------- Arranque ---------- */
(function inicio(){
  marcaRed();
  const hoyISO = new Date().toISOString().slice(0,10);
  if(!estado.visitas.includes(hoyISO)){ estado.visitas.push(hoyISO); Guardar.escribir("visitas", estado.visitas); }
  pintaBarra();
  if(!estado.perfil) pidePerfil();
  render();
  setInterval(()=>{ pintaCab(); if(estado.vista==="hoy") pintaHoy(); }, 60000);
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
})();
})();
</script>
